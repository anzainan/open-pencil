name: Docker Image

on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - 'v*'

concurrency:
  group: docker-image
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=web-latest
            type=semver,pattern={{version}}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 导出镜像 tar（供软路由 docker load，绕开软路由无法直连 ghcr.io 的问题）
      - name: Export image tarball
        run: |
          docker pull ghcr.io/${{ github.repository }}:web-latest
          mkdir -p /tmp/img
          docker save ghcr.io/${{ github.repository }}:web-latest | gzip > /tmp/img/openpencil-web-latest.tar.gz
          ls -lh /tmp/img/

      - name: Upload tarball to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: web-latest
          name: OpenPencil web-latest
          body: |
            OpenPencil web 镜像 tar.gz（供软路由 docker load）
            自动构建：${{ github.sha }}
          files: /tmp/img/openpencil-web-latest.tar.gz
          allowUpdates: true
          draft: false
          prerelease: false

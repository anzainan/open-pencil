# OpenPencil soft-router deployment (docs/deploy-plan.md §5.2)
# Usage:
#   docker compose up -d                              # pull from registry
#   docker compose up -d --build                       # build locally (heavy web build, run on CI/strong machine)
services:
  openpencil:
    image: ${OPENPENCIL_IMAGE:-ghcr.io/anzainan/open-pencil:web-latest}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      # LAN 访问入口（web 端 + 读接口；写接口带 BRIDGE_TOKEN）。
      - "18080:8080"
      # AI（OpenClaw）专用写入口：仅本机 127.0.0.1:8081，不对 LAN 暴露（deploy-plan §5.4）
      # 不需要时删掉本行；AI 脚本用 BRIDGE_URL=http://127.0.0.1:8081 直连
      - "127.0.0.1:8081:8080"
    volumes:
      - ${DESIGN_DIR:-/mnt/数据/工作/设计}:/data/design
      - ${STATE_DIR:-/mnt/数据/.openpencil/state}:/data/state
    environment:
      BRIDGE_PORT: "8080"
      DESIGN_ROOT: /data/design
      STATE_DIR: /data/state
      BRIDGE_TOKEN: ${BRIDGE_TOKEN:-changeme}
      # 分享链接必须指向同事可访问的入口；可通过 .env 覆盖为内网 DNS 名称或反向代理地址。
      # 未配置时服务端仅回退到自身 localhost，不会生成公网链接。
      SHARE_BASE_URL: ${SHARE_BASE_URL:-http://192.168.110.41:18080}
      # 密码明文副本加密 key（ARCH-usersys-pw-disappear §7.2①）：必须在软路由 .env 写入强随机 key
      # 并注入容器，否则加密副本永不落盘（根因 B）。定稿后不得轮换（轮换 = 存量密文全废）。
      PASSWORD_ENC_KEY: ${PASSWORD_ENC_KEY:-}
      # 开启浏览器内存级实时协作：MCP server（@open-pencil/mcp）随容器启动，
      # file-bridge 把 /mcp /rpc /health /ws 反代到同源；AI/浏览器共用此 token。
      # 置空则保持旧行为（/mcp 仍是 file-bridge 自带桥接工具）。
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:-}
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:8080/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    init: true
